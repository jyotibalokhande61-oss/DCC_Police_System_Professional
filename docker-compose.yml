services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dcc_police
      MYSQL_USER: dcc_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-this-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-local-secret}
      DATABASE_URL: mysql+pymysql://dcc_user:${MYSQL_PASSWORD:-change-this-local-password}@db:3306/dcc_police
      FLASK_DEBUG: "false"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
